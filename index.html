<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Beach Garden Deutsch</title>
<meta name="description" content="L'allemand de la réception du camping Beach Garden : leçons, situations guidées et guide de conversation avec de vraies voix allemandes.">
<meta name="theme-color" content="#8E1B2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BG Deutsch">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%238E1B2E'/%3E%3Ccircle cx='40' cy='23' r='7' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Cpath d='M12 40c5-4 9-4 14 0s9 4 14 0 9-4 12-1M12 48c5-4 9-4 14 0s9 4 14 0 9-4 12-1' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#8E1B2E; --brand-600:#761525; --brand-700:#5A0F1C;
  --brand-50:#FBF4F5; --brand-100:#F5E4E7; --brand-200:#E9C6CC;
  --ink:#1D1718; --ink-2:#4A4244; --muted:#857C7F; --faint:#B5ACAF;
  --line:#EEE9EA; --line-2:#E2DADC; --soft:#FAF8F8; --bg:#FFFFFF;
  --ok:#1F7A4D; --ok-bg:#EDF7F1; --ok-line:#BCE0CB;
  --ko:#B42335; --ko-bg:#FCEFF1; --ko-line:#F0C2C9;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:16px; --side:256px;
  --sh:0 1px 2px rgba(29,23,24,.04),0 6px 20px rgba(29,23,24,.05);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; font-family:var(--sans); font-size:15px; line-height:1.5; color:var(--ink); background:var(--bg);
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer; background:none; border:0; padding:0}
:focus-visible{outline:2px solid var(--brand); outline-offset:3px; border-radius:10px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.nw{white-space:nowrap}
.ic{width:20px; height:20px; flex:0 0 auto; fill:none}
.serif{font-family:var(--serif)}
.h1,.stat b,.res b,.hero h2,.l-q{font-variant-numeric:lining-nums; font-feature-settings:"lnum"}
.eyebrow{font-size:11.5px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}

/* ═════════ BOUTONS ═════════ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px; white-space:nowrap;
  border-radius:12px; padding:13px 22px; font-size:15px; font-weight:600; letter-spacing:.01em;
  background:var(--brand); color:#fff; border:1px solid var(--brand);
  transition:background .15s, border-color .15s, color .15s, transform .1s, box-shadow .15s;
}
.btn:hover{background:var(--brand-600); border-color:var(--brand-600)}
.btn:active{transform:scale(.98)}
.btn:disabled{background:var(--line); border-color:var(--line); color:var(--faint); cursor:default; transform:none}
.btn.sec{background:#fff; color:var(--ink); border-color:var(--line-2)}
.btn.sec:hover{border-color:var(--ink-2)}
.btn.sec:disabled{background:#fff; color:var(--faint); border-color:var(--line)}
.btn.light{background:#fff; color:var(--brand); border-color:#fff}
.btn.light:hover{background:var(--brand-50)}
.btn.ok{background:var(--ok); border-color:var(--ok)}
.btn.ko{background:var(--ko); border-color:var(--ko)}
.btn.block{width:100%}
.btn.sm{padding:9px 14px; font-size:14px; border-radius:10px}
.link{color:var(--brand); font-weight:600; font-size:14px; display:inline-flex; align-items:center; gap:4px}
.link:hover{text-decoration:underline; text-underline-offset:3px}

.play{
  width:44px; height:44px; flex:0 0 44px; border-radius:50%; background:var(--brand); color:#fff;
  display:grid; place-items:center; transition:background .15s, transform .1s;
}
.play:hover{background:var(--brand-600)}
.play:active{transform:scale(.94)}
.play .ic{width:20px; height:20px}
.play.sm{width:34px; height:34px; flex-basis:34px; background:#fff; color:var(--brand); border:1px solid var(--brand-200)}
.play.sm:hover{background:var(--brand-50)}
.play.sm .ic{width:16px; height:16px}
.play.lg{width:96px; height:96px; flex-basis:96px; box-shadow:0 10px 30px rgba(142,27,46,.25)}
.play.lg .ic{width:38px; height:38px}
.play.playing{animation:ring 1.2s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(142,27,46,.35)}100%{box-shadow:0 0 0 14px rgba(142,27,46,0)}}
.slow{
  height:34px; padding:0 14px; border-radius:99px; border:1px solid var(--line-2); background:#fff;
  font-size:13px; font-weight:600; color:var(--ink-2); display:inline-flex; align-items:center; gap:6px; transition:border-color .15s, color .15s;
}
.slow:hover{border-color:var(--brand-200); color:var(--brand)}
.slow.playing{border-color:var(--brand); color:var(--brand); background:var(--brand-50)}
.fav{width:36px; height:36px; border-radius:50%; display:grid; place-items:center; color:var(--faint); transition:color .15s, background .15s}
.fav:hover{background:var(--soft); color:var(--ink-2)}
.fav.on{color:var(--brand)}
.fav.on .ic{fill:currentColor}
.icon-btn{width:40px; height:40px; border-radius:50%; display:grid; place-items:center; color:var(--muted)}
.icon-btn:hover{background:var(--soft); color:var(--ink)}

/* ═════════ STRUCTURE ═════════ */
.side,.rail{display:none}
.topbar{
  position:sticky; top:0; z-index:40; background:linear-gradient(120deg,#9A2034,#761525); color:#fff;
  box-shadow:0 2px 14px rgba(90,15,28,.25); padding:10px 16px; padding-top:calc(10px + env(safe-area-inset-top));
  display:flex; align-items:center; gap:12px;
}
.brand{display:flex; align-items:center; gap:11px; min-width:0}
.brand-mark{width:36px; height:36px; flex:0 0 36px}
.logo{height:34px; width:auto; max-width:120px; object-fit:contain; filter:brightness(0) invert(1); flex:0 0 auto}
.topbar .brand-name{color:#fff}
@media (max-width:420px){ .topbar .logo{height:28px} .topbar .brand-name{font-size:15.5px} .topbar .brand-txt{padding-left:9px} .topbar{gap:8px} .topbar .chip{padding:6px 5px} }
.topbar .brand-sub{color:rgba(255,255,255,.75)}
.topbar .brand-txt{padding-left:11px; border-left:1px solid rgba(255,255,255,.3)}
.topbar .chip{color:#fff}
.topbar .chip:hover{background:rgba(255,255,255,.12)}
.emo{font-size:17px; line-height:1}
.badge-ic .emo{font-size:22px}
.brand-txt{line-height:1.1; min-width:0}
.brand-name{font-family:var(--serif); font-weight:600; font-size:18px; color:var(--ink); white-space:nowrap}
.brand-sub{font-size:10.5px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--brand); margin-top:2px}
.chips{margin-left:auto; display:flex; gap:4px}
.chip{display:flex; align-items:center; gap:5px; padding:6px 9px; border-radius:99px; font-weight:600; font-size:14px; color:var(--ink-2)}
.chip:hover{background:var(--soft)}
.chip .ic{width:18px; height:18px; color:var(--brand)}
.chip.off .ic{color:var(--faint)}

main{padding:24px 16px 110px; min-height:100vh; overflow-x:clip}
.wrap{max-width:640px; margin:0 auto}
.wrap.wide{max-width:920px}

.bnav{
  position:fixed; left:0; right:0; bottom:0; z-index:40; background:rgba(255,255,255,.96); backdrop-filter:blur(12px);
  border-top:1px solid var(--line); display:flex; justify-content:space-around; padding:6px 8px calc(6px + env(safe-area-inset-bottom));
}
.nav-btn{
  flex:1; max-width:110px; border-radius:12px; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 4px;
  font-size:11px; font-weight:600; color:var(--muted); transition:color .15s, background .15s;
}
.nav-btn .ic{width:22px; height:22px}
.nav-btn.on{color:var(--brand)}

@media (min-width:900px){
  .topbar,.bnav{display:none}
  .side{
    display:flex; flex-direction:column; gap:4px; position:fixed; inset:0 auto 0 0; width:var(--side);
    border-right:1px solid var(--line); padding:28px 16px; background:#fff; z-index:30;
  }
  .side .brand{flex-direction:column; align-items:flex-start; gap:12px; padding:20px 18px; margin-bottom:22px; border-radius:16px;
    background:linear-gradient(140deg,#9A2034 0%,#761525 60%,#5A0F1C 100%); color:#fff; box-shadow:0 8px 24px rgba(90,15,28,.22)}
  .side .logo{height:46px; max-width:180px}
  .side .brand-mark{width:40px; height:40px; flex-basis:40px}
  .side .brand-name{font-size:20px; color:#fff}
  .side .brand-sub{color:rgba(255,255,255,.75)}
  .side .nav-btn{max-width:none; flex:none; flex-direction:row; gap:14px; padding:11px 14px; font-size:15px; font-weight:500; color:var(--ink-2); position:relative}
  .side .nav-btn:hover{background:var(--soft)}
  .side .nav-btn.on{background:var(--brand-50); color:var(--brand); font-weight:600}
  .side .nav-btn.on::before{content:''; position:absolute; left:-16px; top:10px; bottom:10px; width:3px; border-radius:0 3px 3px 0; background:var(--brand)}
  .side-foot{margin-top:auto; padding:16px 12px 0; border-top:1px solid var(--line); font-size:12.5px; color:var(--muted); line-height:1.6}
  .side-foot b{display:block; color:var(--ink-2); font-weight:600}
  main{margin-left:var(--side); padding:44px 40px 64px}
}
@media (min-width:1240px){
  main{margin-right:360px}
  .rail{
    display:flex; flex-direction:column; gap:16px; position:fixed; top:0; right:0; bottom:0; width:360px;
    padding:36px 32px 32px 0; overflow-y:auto;
  }
  .rail .chips{margin:0 0 4px; justify-content:flex-end}
}

/* ═════════ ÉLÉMENTS COMMUNS ═════════ */
.card{border:1px solid var(--line); border-radius:var(--r); background:#fff; padding:20px}
.card h3{margin:0 0 14px; font-family:var(--serif); font-size:19px; font-weight:600}
.h1{font-family:var(--serif); font-size:34px; font-weight:600; line-height:1.15; margin:0 0 8px; letter-spacing:-.01em}
.lead{margin:0 0 26px; color:var(--muted); font-size:15.5px; line-height:1.55}
.sec-t{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:36px 0 14px}
.sec-t h2{font-family:var(--serif); font-size:23px; font-weight:600; margin:0}
.sec-t span{font-size:13.5px; color:var(--muted)}
.bar{height:6px; border-radius:99px; background:var(--line); overflow:hidden}
.bar i{display:block; height:100%; border-radius:99px; background:var(--brand); transition:width .5s ease}
.badge-ic{width:44px; height:44px; flex:0 0 44px; border-radius:12px; background:var(--brand-50); color:var(--brand); display:grid; place-items:center}
.badge-ic .ic{width:22px; height:22px}

.goal{display:flex; align-items:center; gap:14px}
.ring{--p:0; width:56px; height:56px; flex:0 0 56px; border-radius:50%; background:conic-gradient(var(--brand) calc(var(--p)*1%), var(--line) 0); display:grid; place-items:center}
.ring::before{content:''; grid-area:1/1; width:46px; height:46px; border-radius:50%; background:#fff}
.ring .ic{grid-area:1/1; z-index:1; color:var(--brand); width:22px; height:22px}
.goal-txt b{display:block; font-size:15.5px; font-weight:600}
.goal-txt small{color:var(--muted); font-size:13.5px}

/* ═════════ APPRENDRE ═════════ */
.hero{
  position:relative; overflow:hidden; border-radius:20px; padding:26px 24px 24px; color:#fff; margin-bottom:14px;
  background:linear-gradient(140deg,#9A2034 0%,#7A1627 55%,#5A0F1C 100%);
}
.hero-art{position:absolute; right:-30px; bottom:-40px; width:260px; height:220px; opacity:.16; pointer-events:none}
.hero .eyebrow{color:rgba(255,255,255,.72)}
.hero h2{position:relative; margin:8px 0 4px; font-family:var(--serif); font-size:28px; font-weight:600; line-height:1.2; max-width:80%}
.hero p{position:relative; margin:0 0 18px; font-size:14.5px; color:rgba(255,255,255,.8)}
.hero .bar{background:rgba(255,255,255,.2); max-width:260px; margin-bottom:20px; position:relative}
.hero .bar i{background:#fff}
.hero .btn{position:relative}
.quick{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
@media (max-width:820px){ .quick{grid-template-columns:1fr 1fr} .quick .qk:last-child{grid-column:1/-1} }
.qk{
  display:flex; align-items:center; gap:14px; text-align:left; border:1px solid var(--line); border-radius:var(--r);
  background:#fff; padding:16px; transition:border-color .15s, box-shadow .15s;
}
.qk:hover:not(:disabled){border-color:var(--brand-200); box-shadow:var(--sh)}
.qk b{display:block; font-size:15px; font-weight:600}
.qk small{display:block; font-size:13px; color:var(--muted); line-height:1.4; margin-top:2px}
.qk:disabled{cursor:default}
.qk:disabled .badge-ic{background:var(--soft); color:var(--faint)}
.qk:disabled b{color:var(--muted)}
@media (max-width:520px){ .quick{grid-template-columns:1fr} }

.units{display:grid; gap:12px}
.unit{border:1px solid var(--line); border-radius:var(--r); background:#fff; padding:18px 18px 16px; transition:border-color .15s}
.unit.cur{border-color:var(--brand-200); box-shadow:var(--sh)}
.unit-top{display:flex; gap:14px; align-items:flex-start}
.unit-tx{flex:1; min-width:0}
.unit-tx .eyebrow{font-size:10.5px}
.unit-nm{font-family:var(--serif); font-size:19px; font-weight:600; line-height:1.25; margin:2px 0}
.unit-ds{font-size:13.5px; color:var(--muted); line-height:1.4}
.unit-pc{font-size:13px; font-weight:600; color:var(--muted); white-space:nowrap}
.unit-pc.full{color:var(--brand)}
.stepper{display:flex; align-items:center; margin:18px 0 14px; padding-left:58px}
.stepper .ln{flex:1; height:2px; background:var(--line); min-width:10px; max-width:48px}
.stepper .ln.done{background:var(--brand)}
.dot{
  width:38px; height:38px; flex:0 0 38px; border-radius:50%; border:1.5px solid var(--line-2); background:#fff;
  display:grid; place-items:center; font-size:14px; font-weight:600; color:var(--muted); transition:all .15s;
}
.dot:hover{border-color:var(--brand); color:var(--brand)}
.dot.done{background:var(--brand); border-color:var(--brand); color:#fff}
.dot.done .ic{width:17px; height:17px}
.dot.cur{border:2px solid var(--brand); color:var(--brand); box-shadow:0 0 0 5px var(--brand-50)}
.unit-foot{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-left:58px}
@media (max-width:520px){ .stepper,.unit-foot{padding-left:0} }

/* ═════════ SITUATIONS ═════════ */
.flow-list{display:grid; gap:12px}
.flow{
  display:flex; align-items:center; gap:16px; text-align:left; width:100%;
  border:1px solid var(--line); border-radius:var(--r); background:#fff; padding:18px; transition:border-color .15s, box-shadow .15s;
}
.flow:hover{border-color:var(--brand-200); box-shadow:var(--sh)}
.flow .badge-ic{width:52px; height:52px; flex-basis:52px; border-radius:14px}
.flow .badge-ic .ic{width:24px; height:24px}
.flow-tx{flex:1; min-width:0}
.flow-tx b{display:block; font-size:16.5px; font-weight:600; line-height:1.3}
.flow-tx small{display:block; font-size:14px; color:var(--muted); margin-top:3px; line-height:1.45}
.flow-meta{display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--muted); margin-top:8px}
.flow-meta .done{color:var(--ok); display:inline-flex; align-items:center; gap:4px}
.flow-meta .ic{width:14px; height:14px}
.chev{color:var(--faint)}

.subbar{display:flex; align-items:flex-start; gap:14px; margin-bottom:22px}
.back{width:40px; height:40px; flex:0 0 40px; border-radius:50%; border:1px solid var(--line-2); display:grid; place-items:center; color:var(--ink-2); background:#fff}
.back:hover{border-color:var(--ink-2)}
.subbar-t{flex:1; min-width:0}
.subbar-t b{display:block; font-family:var(--serif); font-size:24px; font-weight:600; line-height:1.2}
.subbar-t small{display:block; font-size:14px; color:var(--muted); margin-top:4px; line-height:1.45}
.steps{display:flex; gap:6px; margin:0 0 20px}
.steps button{flex:1; height:4px; border-radius:99px; background:var(--line); padding:0}
.steps button.done{background:var(--brand-200)}
.steps button.cur{background:var(--brand)}
.step-title{font-family:var(--serif); font-size:26px; font-weight:600; margin:6px 0 20px; line-height:1.2}

.blk{border-radius:var(--r); padding:18px; margin-bottom:12px}
.blk-lb{display:block; margin-bottom:10px}
.blk.say{border:1px solid var(--line); background:#fff; box-shadow:inset 3px 0 0 var(--brand)}
.blk.say .blk-lb{color:var(--brand)}
.blk.hear{background:var(--soft); border:1px solid var(--line)}
.h-line{display:flex; align-items:flex-start; gap:12px; padding:10px 0}
.h-line + .h-line{border-top:1px solid var(--line)}
.h-de{font-size:16px; font-weight:600; line-height:1.4}
.h-fr{font-size:14px; color:var(--muted); margin-top:2px}
.blk.memo{background:var(--brand-50); display:flex; gap:12px; font-size:14.5px; line-height:1.55; color:var(--ink-2)}
.blk.memo > .ic{color:var(--brand); margin-top:2px}
.blk.memo .blk-lb{color:var(--brand-600); margin-bottom:2px}
.blk.memo b{color:var(--ink); font-weight:600}
.step-nav{position:sticky; bottom:74px; display:flex; gap:10px; margin-top:24px; padding:14px 0; background:linear-gradient(to top,#fff 75%,rgba(255,255,255,0))}
.step-nav .btn{flex:1}
@media (min-width:900px){ .step-nav{bottom:0} }

/* ═════════ PHRASES ═════════ */
.search{position:relative; margin-bottom:16px}
.search input{
  width:100%; border:1px solid var(--line-2); background:#fff; border-radius:12px;
  padding:13px 44px 13px 44px; font-size:15.5px; outline:none; transition:border-color .15s, box-shadow .15s;
}
.search input:focus{border-color:var(--brand); box-shadow:0 0 0 4px var(--brand-50)}
.search input::placeholder{color:var(--faint)}
.search .s-ic{position:absolute; left:15px; top:50%; transform:translateY(-50%); color:var(--faint)}
.search .s-x{position:absolute; right:4px; top:50%; transform:translateY(-50%)}
.seg{display:flex; gap:6px; margin-bottom:22px; overflow-x:auto; scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto; border:1px solid var(--line-2); border-radius:99px; padding:8px 15px; font-size:14px; font-weight:500; color:var(--ink-2); background:#fff}
.seg button:hover{border-color:var(--ink-2)}
.seg button.on{background:var(--ink); border-color:var(--ink); color:#fff}
.cat-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
@media (min-width:680px){ .cat-grid{grid-template-columns:repeat(3,1fr)} }
.cat{border:1px solid var(--line); border-radius:var(--r); background:#fff; padding:16px; text-align:left; display:flex; flex-direction:column; gap:10px; transition:border-color .15s, box-shadow .15s}
.cat:hover{border-color:var(--brand-200); box-shadow:var(--sh)}
.cat b{font-size:15px; font-weight:600; line-height:1.3}
.cat small{font-size:13px; color:var(--muted); margin-top:-6px}
.cat .bar{height:4px; margin-top:auto}

.plist{display:grid; gap:12px}
@media (min-width:1000px){ .plist.two{grid-template-columns:1fr 1fr; align-items:start} }
.pc{border:1px solid var(--line); border-radius:var(--r); background:#fff; padding:18px}
.pc-fr{font-size:14px; color:var(--muted); line-height:1.45}
.pc-de{font-size:18px; font-weight:600; color:var(--ink); line-height:1.4; margin-top:6px}
.pc-ph{font-size:14.5px; color:var(--brand); font-style:italic; line-height:1.45; margin-top:6px}
body.no-ph .pc-ph{display:none}
.pc-act{display:flex; gap:10px; align-items:center; margin-top:14px}
.pc-act .fav{margin-left:auto}
.pc-src{font-size:11.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); margin-top:12px; padding-top:12px; border-top:1px solid var(--line)}
mark{background:var(--brand-100); color:inherit; border-radius:3px; padding:0 2px}
.empty{text-align:center; padding:48px 20px; color:var(--muted)}
.empty .badge-ic{margin:0 auto 14px; width:56px; height:56px; border-radius:50%}
.empty b{display:block; font-family:var(--serif); font-size:20px; color:var(--ink); font-weight:600; margin-bottom:6px}
.empty p{margin:0 auto; max-width:340px; line-height:1.55}
.guide{border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.g-row{display:grid; grid-template-columns:minmax(110px,1fr) minmax(70px,.7fr) 1.6fr; gap:12px; align-items:center; padding:13px 18px}
.g-row + .g-row{border-top:1px solid var(--line)}
.g-row.head{background:var(--soft)}
.g-de{font-size:16px; font-weight:600}
.g-fr{font-size:16px; font-weight:600; color:var(--brand)}
.g-ex{font-size:13.5px; color:var(--muted)}
.g-ex i{font-style:normal; color:var(--ink-2); font-weight:600}
.rules{columns:1; column-gap:12px}
@media (min-width:760px){ .rules{columns:2} }
.rule{border:1px solid var(--line); border-radius:var(--r); padding:18px 20px; background:#fff; break-inside:avoid; margin-bottom:12px}
.rule h3{display:flex; align-items:center; gap:10px; margin:0 0 10px; font-family:var(--serif); font-size:19px; font-weight:600}
.rule h3 .emo{font-size:22px}
.rule ul{margin:0; padding:0; list-style:none}
.rule li{position:relative; padding:7px 0 7px 18px; font-size:14.5px; line-height:1.5; color:var(--ink-2)}
.rule li + li{border-top:1px solid var(--line)}
.rule li::before{content:''; position:absolute; left:2px; top:15px; width:6px; height:6px; border-radius:50%; background:var(--brand)}
.rule li b{color:var(--ink); font-weight:600}
.src-note{font-size:13px; color:var(--muted); margin-top:16px; line-height:1.55}

/* ═════════ PROFIL ═════════ */
.prof-head{display:flex; align-items:center; gap:18px; margin-bottom:8px}
.mono{width:72px; height:72px; flex:0 0 72px; border-radius:50%; display:grid; place-items:center; background:var(--brand); color:#fff; font-family:var(--serif); font-size:30px; font-weight:600}
.mono .ic{width:30px; height:30px}
.name-in{border:1px solid var(--line-2); border-radius:10px; padding:10px 12px; font-size:17px; font-weight:600; width:100%; max-width:320px; outline:none; margin-top:6px}
.name-in:focus{border-color:var(--brand); box-shadow:0 0 0 4px var(--brand-50)}
.stats{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.stat{border:1px solid var(--line); border-radius:var(--r); padding:16px; display:flex; gap:12px; align-items:center}
.stat b{display:block; font-family:var(--serif); font-size:24px; font-weight:600; line-height:1.1}
.stat small{font-size:13px; color:var(--muted)}
.goals{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
@media (max-width:520px){ .goals{grid-template-columns:1fr 1fr} }
.goal-opt{border:1px solid var(--line-2); border-radius:12px; background:#fff; padding:12px; text-align:left; transition:all .15s}
.goal-opt b{display:block; font-size:15px; font-weight:600}
.goal-opt small{font-size:12.5px; color:var(--muted)}
.goal-opt:hover{border-color:var(--ink-2)}
.goal-opt.on{border-color:var(--brand); background:var(--brand-50); box-shadow:inset 0 0 0 1px var(--brand)}
.goal-opt.on b{color:var(--brand)}
.setting{display:flex; align-items:center; gap:14px; padding:16px 0}
.setting + .setting{border-top:1px solid var(--line)}
.setting .s-tx{flex:1}
.setting b{display:block; font-size:15px; font-weight:600}
.setting small{font-size:13.5px; color:var(--muted)}
.switch{width:46px; height:28px; flex:0 0 46px; border-radius:99px; background:var(--line-2); position:relative; transition:background .2s}
.switch::after{content:''; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.2); transition:transform .2s}
.switch[aria-checked="true"]{background:var(--brand)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
.danger{color:var(--ko); font-weight:600; font-size:14px; padding:10px 0}
.danger:hover{text-decoration:underline; text-underline-offset:3px}
.about{font-size:13px; color:var(--muted); line-height:1.6; margin-top:28px; padding-top:18px; border-top:1px solid var(--line)}

/* ═════════ LEÇON ═════════ */
.lesson{position:fixed; inset:0; z-index:100; background:#fff; display:flex; flex-direction:column; animation:fadein .2s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.l-top{display:flex; align-items:center; gap:14px; padding:16px; padding-top:calc(16px + env(safe-area-inset-top)); max-width:760px; width:100%; margin:0 auto}
.l-top .bar{flex:1; height:8px}
.l-body{flex:1; overflow-y:auto; padding:20px 16px 28px}
.l-inner{max-width:600px; margin:0 auto; min-height:100%; display:flex; flex-direction:column}
.l-kind{color:var(--brand)}
.l-q{font-family:var(--serif); font-size:27px; font-weight:600; margin:8px 0 26px; line-height:1.2}
.l-audio{display:flex; flex-direction:column; align-items:center; gap:14px; margin:4px 0 32px}
.l-say{border:1px solid var(--line); background:var(--soft); border-radius:14px; padding:16px 18px; font-size:18px; font-weight:500; line-height:1.45; margin-bottom:24px}
.opts{display:grid; gap:10px}
.opt{
  display:flex; align-items:center; gap:14px; text-align:left; width:100%; border:1px solid var(--line-2); border-radius:12px;
  background:#fff; padding:14px 16px; font-size:16px; font-weight:500; line-height:1.4; transition:border-color .12s, background .12s;
}
.opt:hover{border-color:var(--ink-2)}
.opt kbd{flex:0 0 26px; height:26px; border:1px solid var(--line-2); border-radius:7px; display:grid; place-items:center; font:600 12.5px var(--sans); color:var(--muted)}
.opt.sel{border-color:var(--brand); background:var(--brand-50); box-shadow:inset 0 0 0 1px var(--brand)}
.opt.sel kbd{border-color:var(--brand); color:var(--brand)}
.opt.ok{border-color:var(--ok); background:var(--ok-bg); color:var(--ok); box-shadow:inset 0 0 0 1px var(--ok)}
.opt.ok kbd{border-color:var(--ok-line); color:var(--ok)}
.opt.ko{border-color:var(--ko); background:var(--ko-bg); color:var(--ko); box-shadow:inset 0 0 0 1px var(--ko)}
.opt.ko kbd{border-color:var(--ko-line); color:var(--ko)}
.opts.locked .opt{pointer-events:none}
.answer-line{min-height:118px; padding:10px 0; display:flex; flex-wrap:wrap; align-content:flex-start; gap:8px; margin-bottom:28px;
  background:repeating-linear-gradient(to bottom,transparent 0 57px,var(--line-2) 57px 58px)}
.bank{display:flex; flex-wrap:wrap; justify-content:center; gap:8px}
.tile{border:1px solid var(--line-2); border-radius:10px; background:#fff; padding:9px 14px; font-size:16.5px; font-weight:500; min-height:46px; box-shadow:0 1px 2px rgba(0,0,0,.04); transition:border-color .12s}
.tile:hover{border-color:var(--ink-2)}
.tile.used{color:transparent; background:var(--soft); border-color:var(--line); box-shadow:none; pointer-events:none}
.pairs{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.pairs .col{display:grid; gap:10px; align-content:start}
.pair{border:1px solid var(--line-2); border-radius:12px; background:#fff; padding:14px 10px; font-size:16px; font-weight:500; min-height:58px; transition:all .12s}
.pair:hover{border-color:var(--ink-2)}
.pair.sel{border-color:var(--brand); background:var(--brand-50); color:var(--brand); box-shadow:inset 0 0 0 1px var(--brand)}
.pair.ok{border-color:var(--line); color:var(--faint); background:var(--soft); pointer-events:none}
.pair.ko{border-color:var(--ko); background:var(--ko-bg); color:var(--ko); animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.l-foot{border-top:1px solid var(--line); padding:16px; padding-bottom:calc(16px + env(safe-area-inset-bottom)); background:#fff; transition:background .15s}
.l-foot-in{max-width:760px; margin:0 auto; display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.l-foot .btn{margin-left:auto; min-width:180px}
.l-fb{display:none; align-items:flex-start; gap:12px; flex:1; min-width:240px}
.l-fb .fb-ic{width:36px; height:36px; flex:0 0 36px; border-radius:50%; display:grid; place-items:center; color:#fff}
.l-fb b{display:block; font-size:17px; font-weight:600}
.l-fb .fb-sol{font-size:15px; font-weight:500; line-height:1.45; margin-top:2px; color:var(--ink)}
.l-fb .fb-sub{font-size:14px; color:var(--ink-2); margin-top:2px; line-height:1.45}
.l-foot.good{background:var(--ok-bg); border-top-color:var(--ok-line)}
.l-foot.good .l-fb{display:flex; color:var(--ok)}
.l-foot.good .fb-ic{background:var(--ok)}
.l-foot.bad{background:var(--ko-bg); border-top-color:var(--ko-line)}
.l-foot.bad .l-fb{display:flex; color:var(--ko)}
.l-foot.bad .fb-ic{background:var(--ko)}
@media (max-width:640px){ .l-foot .btn{width:100%; margin-left:0} .l-fb{min-width:0; flex-basis:100%} }
.l-end{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px 0}
.l-end .seal{width:96px; height:96px; border-radius:50%; background:var(--brand); color:#fff; display:grid; place-items:center; box-shadow:0 0 0 10px var(--brand-50); animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.l-end .seal .ic{width:44px; height:44px; stroke-width:2.4}
@keyframes pop{from{transform:scale(.3); opacity:0}to{transform:scale(1); opacity:1}}
.l-end h2{font-family:var(--serif); font-size:32px; font-weight:600; margin:28px 0 6px}
.l-end p{color:var(--muted); font-size:15.5px; margin:0 0 28px; max-width:360px}
.res{display:grid; grid-template-columns:repeat(4,1fr); border:1px solid var(--line); border-radius:var(--r); width:100%; max-width:520px}
.res div{padding:16px 8px}
.res div + div{border-left:1px solid var(--line)}
.res b{display:block; font-family:var(--serif); font-size:24px; font-weight:600; color:var(--ink)}
.res small{font-size:12px; color:var(--muted)}
@media (max-width:480px){ .res{grid-template-columns:1fr 1fr} .res div:nth-child(3){border-left:0} .res div:nth-child(n+3){border-top:1px solid var(--line)} }

/* ═════════ DIVERS ═════════ */
.toast{
  position:fixed; left:50%; bottom:96px; transform:translate(-50%,16px); opacity:0; z-index:300;
  background:var(--ink); color:#fff; padding:11px 16px; border-radius:12px; font-size:14px; font-weight:500;
  transition:all .25s; pointer-events:none; max-width:calc(100% - 32px); text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.2)
}
.toast.on{opacity:1; transform:translate(-50%,0)}
@media (min-width:900px){ .toast{bottom:32px; margin-left:calc(var(--side)/2)} }
.modal{position:fixed; inset:0; z-index:250; background:rgba(29,23,24,.45); display:grid; place-items:center; padding:16px; animation:fadein .15s}
.modal-c{background:#fff; border-radius:20px; padding:28px 24px 22px; max-width:400px; width:100%; text-align:center; animation:pop .25s ease-out}
.modal-c h3{font-family:var(--serif); font-size:22px; font-weight:600; margin:0 0 8px}
.modal-c p{color:var(--muted); margin:0 0 22px; line-height:1.55}
.modal-c .btn + .btn{margin-top:8px}
.confetti{position:fixed; inset:0; pointer-events:none; z-index:400; overflow:hidden}
.confetti i{position:absolute; top:-16px; width:7px; height:12px; border-radius:2px; animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(var(--r)); opacity:.8}}
.view{animation:fadein .25s}

/* ═════════ INSTALLATION ET PARTAGE ═════════ */
.promo{display:flex; align-items:center; gap:14px; flex-wrap:wrap; border:1px solid var(--brand-200); background:var(--brand-50); border-radius:var(--r); padding:14px 16px; margin-bottom:22px}
.promo-ic{font-size:30px; line-height:1}
.promo-tx{flex:1; min-width:180px}
.promo-tx b{display:block; font-size:15.5px; font-weight:600}
.promo-tx small{display:block; font-size:13.5px; color:var(--ink-2); margin-top:2px; line-height:1.45}
.promo-act{display:flex; align-items:center; gap:4px; margin-left:auto}
.promo-x{width:36px; height:36px; border-radius:50%; display:grid; place-items:center; color:var(--muted)}
.promo-x:hover{background:#fff}
.sheet{max-width:440px; text-align:left; max-height:calc(100vh - 32px); overflow-y:auto}
.sheet .sh-ic{font-size:44px; line-height:1; margin-bottom:10px; text-align:center}
.sheet h3{text-align:center}
.sheet p{text-align:center; margin:0 0 16px}
.steps-list{list-style:none; margin:0 0 16px; padding:0; display:grid; gap:10px}
.steps-list li{display:flex; gap:14px; align-items:center; background:var(--soft); border-radius:12px; padding:14px; font-size:16.5px; line-height:1.45}
.st-n{flex:0 0 34px; height:34px; border-radius:50%; background:var(--brand); color:#fff; display:grid; place-items:center; font-weight:700; font-size:16px}
.kbd-ic{display:inline-grid; place-items:center; width:30px; height:30px; border-radius:8px; background:#fff; border:1px solid var(--line-2); color:#0A7AFF; vertical-align:middle; margin:0 2px}
.kbd-ic .ic{width:18px; height:18px}
.warn{background:#FFF6E0; border-radius:10px; padding:10px 12px; font-size:14.5px}
.done-tip{font-size:15px; color:var(--ok)}
.ios-arrow{position:fixed; left:50%; bottom:calc(8px + env(safe-area-inset-bottom)); transform:translateX(-50%); font-size:40px; animation:nudge 1s ease-in-out infinite; z-index:260}
@keyframes nudge{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,8px)}}
.qr{display:grid; place-items:center; margin:4px auto 10px; width:240px; max-width:100%}
.qr svg{width:100%; height:auto; display:block}
.url{text-align:center; font-size:13px; color:var(--muted); word-break:break-all; margin-bottom:16px}
.share-btns{display:grid; gap:8px; margin-bottom:8px}
.share-btns .btn + .btn{margin-top:0}
.sheet > .btn.sec{margin-top:8px}
.pill-ok{font-size:13px; font-weight:600; color:var(--ok); background:var(--ok-bg); border-radius:99px; padding:6px 12px}
#poster{display:none}
@media print{
  body > *:not(#poster){display:none!important}
  #poster{display:block!important; text-align:center; font-family:var(--sans); color:#000; padding:10mm}
  .po-brand{display:flex; flex-direction:column; align-items:center; gap:6mm; margin-bottom:12mm}
  .po-logo{width:120mm; height:auto}
  .po-brand b{text-align:center!important}
  .po-brand span{text-align:center!important}
  .po-brand b{display:block; font-family:var(--serif); font-size:26px; text-align:left}
  .po-brand span{display:block; font-size:14px; color:#555; text-align:left}
  #poster h1{font-family:var(--serif); font-size:34px; line-height:1.25; margin:0 0 10mm}
  .po-qr{width:95mm; margin:0 auto 10mm}
  .po-qr svg{width:100%; height:auto}
  #poster ol{list-style:none; padding:0; margin:0 auto; max-width:140mm; text-align:left; font-size:20px; line-height:1.5}
  #poster li{display:flex; align-items:center; gap:14px; margin-bottom:6mm}
  #poster li .po-n{flex:0 0 40px; height:40px; border-radius:50%; background:#8E1B2E; color:#fff; display:grid; place-items:center; font-weight:700; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  .po-url{font-size:12px; color:#555; margin-top:8mm}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important}
  .confetti{display:none}
}
</style>

  {c:5,e:"🅿️",fr:"Le parking se trouve à l'entrée.",de:"Der Parkplatz befindet sich am Eingang des Campingplatzes.",ph:"Dèr Park-platss beu-findèt zich am Aïn-gang dèss Kamping-platsèss."},

  // ── Règles & Sécurité
  {c:6,e:"🌙",fr:"Le silence est obligatoire après vingt-deux heures.",de:"Ab zweiundzwanzig Uhr gilt Nachtruhe auf dem Campingplatz.",ph:"Ap tsvaï-ount-tsvan-tsig Ouir guilt Nakht-roueu aouf dème Kamping-platss."},
  {c:6,e:"🚗",fr:"La vitesse est limitée à dix kilomètres par heure.",de:"Die Höchstgeschwindigkeit beträgt zehn Kilometer pro Stunde.",ph:"Di Heukst-guéchvindich-kaït beu-trègt tsèn Kilomètèr pro Chtoundeu."},
  {c:6,e:"🚫",fr:"Le bracelet doit être porté en permanence.",de:"Das Armband muss jederzeit getragen werden.",ph:"Dass Arm-band mouss yèdèr-tsaït guétragène vèrdène."},
  {c:6,e:"🗑️",fr:"Les poubelles se trouvent à l'entrée.",de:"Die Mülleimer befinden sich am Eingang des Campingplatzes.",ph:"Di Mul-aïmèr beu-findène zich am Aïn-gang dèss Kamping-platsèss."},
  {c:6,e:"♻️",fr:"Merci de trier vos déchets.",de:"Bitte trennen Sie Ihren Abfall.",ph:"Biteu trènène zi irène Apfal."},
  {c:6,e:"🔥",fr:"Seuls les barbecues électriques sont autorisés.",de:"Nur Elektrogrills sind erlaubt.",ph:"Nour Élèktro-grilss zint èr-laoubt."},
  {c:6,e:"🏃",fr:"Les enfants doivent être accompagnés la nuit.",de:"Kinder müssen nachts von Erwachsenen begleitet werden.",ph:"Kindèr muissène nakhts fon Èr-vakhzènène beu-glaïtèt vèrdène."},

  // ── Urgences & Problèmes
  {c:7,e:"🆘",fr:"En cas d'urgence, appelez le quinze ou le dix-huit.",de:"Im Notfall rufen Sie bitte die Fünfzehn oder die Achtzehn an.",ph:"Im Not-fal roufène zi biteu di Funf-tsèn odèr di Akht-tsèn an."},
  {c:7,e:"🏥",fr:"Je vais appeler les secours immédiatement.",de:"Ich rufe sofort den Notdienst an.",ph:"Ich roufeu zofort dène Not-dinst an."},
  {c:7,e:"💊",fr:"La pharmacie la plus proche est à cinq cents mètres.",de:"Die nächste Apotheke ist fünfhundert Meter entfernt.",ph:"Di nèchsteu Apoté-keu ist fuunfhoundèrt Mètèr ènt-fèrnt."},
  {c:7,e:"🔧",fr:"Je vais envoyer quelqu'un pour réparer.",de:"Ich schicke jemanden vorbei, um das zu reparieren.",ph:"Ich chikeu yèmandène forbaï, oom dass tsou rèparirène."},
  {c:7,e:"🔇",fr:"Veuillez baisser le volume, s'il vous plaît.",de:"Bitte drehen Sie die Musik leiser.",ph:"Biteu drèuène zi di Mouzik laïzèr."},
  {c:7,e:"🚔",fr:"En cas de vol, appelez le dix-sept.",de:"Bei einem Diebstahl rufen Sie bitte die Siebzehn an.",ph:"Baï aïnème Dip-chtal roufène zi biteu di zip-tsèn an."},
  {c:7,e:"🔐",fr:"J'ai perdu mon bracelet.",de:"Ich habe mein Armband verloren.",ph:"Ich habeu maïn Arm-band fèr-lorène."},
  {c:7,e:"🚿",fr:"Il n'y a pas d'eau chaude dans le mobil-home.",de:"Im Mobilheim gibt es kein warmes Wasser.",ph:"Im Mobil-haïm guibt èss kaïn varmèss Vassèr."},

  // ── Région & Sorties
  {c:8,e:"🏘️",fr:"Le village de Marseillan est à sept kilomètres.",de:"Das Dorf Marseillan liegt sieben Kilometer entfernt.",ph:"Dass Dorf Marsèyan likt zibène Kilomètèr ènt-fèrnt."},
  {c:8,e:"⛵",fr:"Sète et son canal sont très pittoresques.",de:"Sète und sein Kanal sind sehr malerisch.",ph:"Sèt ount zaïn Kanal zint zèr malèrish."},
  {c:8,e:"🚴",fr:"Une piste cyclable mène jusqu'à Marseillan.",de:"Ein Radweg führt bis nach Marseillan.",ph:"Aïn Rad-vèk fuirt biss nakh Marsèyan."},
  {c:8,e:"🍷",fr:"Le Noilly Prat se déguste au port de Marseillan.",de:"Den Noilly Prat kann man im Hafen von Marseillan probieren.",ph:"Dène Noyay-Prat kan man im Hafène fon Marsèyan probirène."},
  {c:8,e:"🎡",fr:"Le Cap d'Agde est à dix minutes en voiture.",de:"Cap d'Agde ist zehn Minuten mit dem Auto entfernt.",ph:"Kap-d'Agdeu ist tsèn Minutène mit dème Aouto ènt-fèrnt."},
  {c:8,e:"🌊",fr:"L'étang de Thau est à quelques minutes.",de:"Der Thau-See ist nur wenige Minuten entfernt.",ph:"Dèr To-Zé ist nour vènigeu Minutène ènt-fèrnt."},
  {c:8,e:"🐚",fr:"Les huîtres de Thau sont délicieuses.",de:"Die Austern aus dem Thau-See sind köstlich.",ph:"Di Aoustèrne aous dème To-Zé zint keustlich."},
  {c:8,e:"🎪",fr:"Le marché de Marseillan a lieu le mardi matin.",de:"Der Markt von Marseillan findet dienstags morgens statt.",ph:"Dèr Markt fon Marsèyan findèt dinss-taks morgèns chtat."},

  // ── Ajouts basés sur le site officiel lesmediterranees.com
  {c:0,e:"📆",fr:"Le camping est ouvert d'avril à octobre.",de:"Der Campingplatz ist von April bis Oktober geöffnet.",ph:"Dèr Kamping-platss ist fon April biss Oktobèr guéeufnèt."},
  {c:1,e:"🛖",fr:"La Cabane Réserve accueille de quatre à six personnes.",de:"Die Cabane Réserve bietet Platz für vier bis sechs Personen.",ph:"Di Kabane Rézèrve bitèt Platss fuir fir biss zèkss Pèrzonène."},
  {c:1,e:"🏡",fr:"Le Garden Family est prévu pour six à huit personnes.",de:"Das Garden Family ist für sechs bis acht Personen.",ph:"Dass Gardène Fémili ist fuir zèkss biss akht Pèrzonène."},
  {c:1,e:"🏊",fr:"La Villa La Coquille dispose de sa propre piscine privée.",de:"Die Villa La Coquille hat einen eigenen privaten Pool.",ph:"Di Villa La Coquille hat aïnène aïguènène privatène Poul."},
  {c:1,e:"🛏️",fr:"Les draps et les serviettes sont inclus, sauf dans la gamme Cosy.",de:"Bettwäsche und Handtücher sind inklusive, außer in der Cosy-Kategorie.",ph:"Bèt-vècheu ount Hant-tuichèr zint inklouziveu, aoussèr in dèr Kozi-katégori."},
  {c:2,e:"🏷️",fr:"En réservant tôt, vous bénéficiez de 10 % de réduction.",de:"Bei früher Buchung erhalten Sie zehn Prozent Rabatt.",ph:"Baï fruïèr Boukhoung èr-haltène zi tsèn Protsènt Rabat."},
  {c:3,e:"📏",fr:"La grande piscine du Beach Garden fait trente-trois mètres de long.",de:"Der große Pool im Beach Garden ist dreiunddreißig Meter lang.",ph:"Dèr greusseu Poul im Beach Garden ist draï-ount-draïssig Mètèr lang."},
  {c:3,e:"🛁",fr:"L'espace balnéo couvert propose une eau calme ou pétillante.",de:"Der überdachte Wellnessbereich bietet ruhiges oder sprudelndes Wasser.",ph:"Dèr ubèr-dakhteu Vèlnèss-béraïch bitèt rouiguèss odèr chproudèlndèss Vassèr."},
  {c:5,e:"🍽️",fr:"Le restaurant Le Bistro a une vue panoramique sur la mer.",de:"Das Restaurant Le Bistro hat einen Panoramablick auf das Meer.",ph:"Dass Rèstoran Le Bistro hat aïnène Panorama-blik aouf dass Mèr."},
  {c:5,e:"🍹",fr:"Au bar, trente minutes de Wi-Fi sont offertes toutes les six heures.",de:"An der Bar sind alle sechs Stunden dreißig Minuten WLAN gratis.",ph:"An dèr Bar zint aleu zèkss Chtoundène draïssig Minoutène Vé-lan gratiss."},
  {c:5,e:"🧖",fr:"Le spa Bulle des Sables propose hammam, sauna, massages et bar à ongles.",de:"Das Spa Bulle des Sables bietet Hammam, Sauna, Massagen und ein Nagelstudio.",ph:"Dass Chpa Bulle des Sables bitèt Hamam, Zaouna, Massagène ount aïn Naguèl-chtoudio."},
  {c:5,e:"🏐",fr:"Il y a du beach-volley et de l'aquagym.",de:"Es gibt Beachvolleyball und Aquagym.",ph:"Èss guibt Beach-volibal ount Akva-guim."},
  {c:5,e:"🧒",fr:"Il y a un mini-club pour les enfants et un club pour les ados.",de:"Es gibt einen Miniclub für Kinder und einen Club für Jugendliche.",ph:"Èss guibt aïnène Mini-kloub fuir Kindèr ount aïnène Kloub fuir Yougènt-licheu."},
  {c:6,e:"🚶",fr:"Tout visiteur doit se présenter à la réception ; une redevance s'applique au-delà de deux heures.",de:"Jeder Besucher muss sich an der Rezeption melden; nach zwei Stunden wird eine Gebühr fällig.",ph:"Yédèr Beu-zoukhèr mouss zich an dèr Rétsèptsion mèldène; nakh tsvaï Chtoundène virt aïneu Guébur fèlich."},
  {c:8,e:"🦪",fr:"On déguste les huîtres de Bouzigues au bord de l'étang de Thau.",de:"In Bouzigues isst man Austern direkt am Thau-See.",ph:"In Bouzig isst man Aoustèrn dirèkt am To-Zé."},

  // ── Règlement intérieur, FAQ et CGV (source : lesmediterranees.com)
  {c:0,e:"🌃",fr:"Vous pouvez arriver jusqu'à 23 h au plus tard.",de:"Sie können spätestens bis dreiundzwanzig Uhr anreisen.",ph:"Zi keunène chpè-tèstèns biss draï-ount-tsvan-tsig Ouir an-raïzène."},
  {c:0,e:"🧹",fr:"En location, le départ se fait entre 8 h et 10 h. Après 10 h, une nuit supplémentaire peut être facturée.",de:"In der Mietunterkunft erfolgt die Abreise zwischen acht und zehn Uhr. Nach zehn Uhr kann eine zusätzliche Nacht berechnet werden.",ph:"In dèr Mit-ountèr-kounft èr-folgt di Ap-raïzeu tsvichène akht ount tsèn Ouir. Nakh tsèn Ouir kan aïneu tsou-sèts-licheu Nakht beu-rèchnèt vèrdène."},
  {c:0,e:"💰",fr:"La caution vous est restituée si le logement est propre et l'inventaire complet.",de:"Sie erhalten die Kaution zurück, wenn die Unterkunft sauber und das Inventar vollständig ist.",ph:"Zi èr-haltène di Kaou-tsion tsou-ruk, vèn di Ountèr-kounft zaoubèr ount dass Invèntar fol-chtèndich ist."},
  {c:2,e:"🧾",fr:"À plus de 30 jours de l'arrivée, un acompte de 30 % est demandé ; à moins de 30 jours, le séjour est réglé en totalité.",de:"Bei einer Buchung mehr als dreißig Tage vor der Anreise zahlen Sie dreißig Prozent an, bei weniger als dreißig Tagen den gesamten Betrag.",ph:"Baï aïnèr Boukhoung mèr als draïssich Tageu for dèr An-raïzeu tsalène zi draïssich Protsènt an, baï vènigèr als draïssich Taguène dène guézamtène Beu-trak."},
  {c:2,e:"✍️",fr:"Toute modification doit être demandée par écrit au moins 30 jours avant l'arrivée, selon les disponibilités.",de:"Änderungen müssen mindestens dreißig Tage vor der Anreise schriftlich beantragt werden, je nach Verfügbarkeit.",ph:"Èndèroungène mussène mindèstèns draïssich Tageu for dèr An-raïzeu chrift-lich beu-an-trakt vèrdène, yé nakh Fèr-fug-bar-kaït."},
  {c:2,e:"🏛️",fr:"La taxe de séjour est fixée par la commune.",de:"Die Kurtaxe wird von der Gemeinde festgelegt.",ph:"Di Kour-takseu virt fon dèr Guémaïndeu fèst-guélègt."},
  {c:1,e:"🐶",fr:"Un seul chien est accepté, ou deux petits chiens de moins de 10 kg.",de:"Erlaubt ist ein Hund oder zwei kleine Hunde unter zehn Kilo.",ph:"Èr-laoubt ist aïn Hount odèr tsvaï klaïneu Houndeu ountèr tsèn Kilo."},
  {c:1,e:"💉",fr:"Les chiens doivent être tenus en laisse et vaccinés. Merci de nous présenter le carnet de vaccination.",de:"Hunde müssen an der Leine geführt werden und geimpft sein. Bitte zeigen Sie uns den Impfpass.",ph:"Houndeu mussène an dèr Laïneu guéfurt vèrdène ount gué-impft zaïn. Biteu tsaïguène zi ouns dène Impf-pass."},
  {c:3,e:"👙",fr:"Pour les femmes, maillot une pièce ou bikini ; pour les hommes, slip de bain.",de:"Für Damen ist ein Badeanzug oder ein Bikini erlaubt, für Herren eine Badehose.",ph:"Fur Damène ist aïn Badeu-an-tsouk odèr aïn Bikini èr-laoubt, fur Hèrène aïneu Badeu-hozeu."},
  {c:3,e:"🐾",fr:"Les animaux sont interdits dans l'espace piscine.",de:"Tiere sind im Poolbereich verboten.",ph:"Tireu zint im Poul-beu-raïch fèr-botène."},
  {c:6,e:"🚧",fr:"De 23 h à 7 h, le portail est fermé et la circulation est interdite.",de:"Von dreiundzwanzig bis sieben Uhr ist die Einfahrt geschlossen und das Fahren verboten.",ph:"Fon draï-ount-tsvan-tsig biss zibène Ouir ist di Aïn-fart guéchlossène ount dass Farène fèr-botène."},
  {c:6,e:"🚙",fr:"Un seul véhicule est autorisé par emplacement ; les autres se garent sur le parking.",de:"Pro Stellplatz ist nur ein Fahrzeug erlaubt; weitere Fahrzeuge parken bitte auf dem Parkplatz.",ph:"Pro Chtel-platss ist nour aïn Far-tsoïg èr-laoubt; vaïtèreu Far-tsoïgeu parkène biteu aouf dème Park-platss."},
  {c:6,e:"🍖",fr:"Les barbecues à charbon sont strictement interdits.",de:"Holzkohlegrills sind streng verboten.",ph:"Holts-koleu-grilss zint chtrèng fèr-botène."},
  {c:6,e:"🎟️",fr:"Pour un visiteur, l'accès aux piscines et aux animations coûte 10 € par personne et par jour.",de:"Für Besucher kostet der Zugang zu den Pools und zum Animationsprogramm zehn Euro pro Person und Tag.",ph:"Fur Beu-zoukhèr kostèt dèr Tsougang tsou dène Poulss ount tsoum Animatsions-programm tsèn Oï-ro pro Pèrzone ount Tak."},
  {c:6,e:"🕚",fr:"Les visiteurs doivent quitter le camping au plus tard à 23 h.",de:"Besucher müssen den Campingplatz spätestens um dreiundzwanzig Uhr verlassen.",ph:"Beu-zoukhèr mussène dène Kamping-platss chpè-tèstèns oum draï-ount-tsvan-tsig Ouir fèr-lassène."},

   AUDIO — MP3 pré-enregistré, repli synthèse vocale
══════════════════════════════════════ */
let deVoice=null, curAudio=null, curBtn=null;
function loadVoices(){
  if(!window.speechSynthesis) return;
  const v=speechSynthesis.getVoices();
  deVoice = v.find(x=>x.lang==='de-DE') || v.find(x=>x.lang && x.lang.toLowerCase().replace('_','-').startsWith('de')) || null;
}
if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; setTimeout(loadVoices,500); }
let unlocked=false;
function unlockAudio(){
  if(unlocked || !window.speechSynthesis) return;
  try{ const u=new SpeechSynthesisUtterance(''); u.volume=0; speechSynthesis.speak(u); unlocked=true; }catch(e){}
}
document.addEventListener('pointerdown', unlockAudio);

function stopAudio(){
  if(curAudio){ try{ curAudio.pause(); }catch(e){} curAudio=null; }
  if(window.speechSynthesis){ try{ speechSynthesis.cancel(); }catch(e){} }
  if(curBtn){ curBtn.classList.remove('playing'); curBtn=null; }
}
function play(de, btn, slow){
  if(btn && curBtn===btn){ stopAudio(); return; }
  stopAudio();
  if(btn){ btn.classList.add('playing'); curBtn=btn; }
  const done = () => { if(btn && curBtn===btn){ btn.classList.remove('playing'); curBtn=null; } };
  const src = window.AUDIO && window.AUDIO[de];
  if(src){
    const a=new Audio(src);
    a.playbackRate = slow ? 0.6 : 1;
    try{ a.preservesPitch=true; a.mozPreservesPitch=true; a.webkitPreservesPitch=true; }catch(e){}
    curAudio=a;
    a.onended=()=>{ done(); if(curAudio===a) curAudio=null; };
    a.onerror=()=>{ if(curAudio===a){ curAudio=null; tts(de,done,slow); } };
    a.play().catch(()=>{ if(curAudio===a){ curAudio=null; tts(de,done,slow); } });
    return;
  }
  tts(de,done,slow);
}
function tts(de, done, slow){
  if(!window.speechSynthesis){ done(); return; }
  loadVoices();
  const u=new SpeechSynthesisUtterance(de);
  u.lang='de-DE'; u.rate=slow?0.55:0.85; if(deVoice) u.voice=deVoice;
  u.onend=done; u.onerror=done;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

/* Effets sonores discrets (générés, aucun fichier) */
let actx=null;
function sfx(kind){
  if(!S.sfx) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const seq = {ok:[[659.3,0],[987.8,.08]], ko:[[311.1,0],[277.2,.1]], win:[[523.3,0],[659.3,.09],[784,.18],[1046.5,.27]]}[kind];
    const t0=actx.currentTime+.01;
    seq.forEach(([f,t])=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t0+t); g.gain.exponentialRampToValueAtTime(kind==='ko'?.1:.16,t0+t+.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+t+(kind==='win'?.45:.22));
      o.connect(g).connect(actx.destination); o.start(t0+t); o.stop(t0+t+.5);
    });
  }catch(e){}
}

/* ══════════════════════════════════════
   RÉSOLUTION DES PHRASES PAR CLÉ
   p12 = P[12] · fID.étape.bloc = réplique d'un parcours · hID.étape.bloc.item = réponse client
══════════════════════════════════════ */
function byKey(key){
  if(!key) return null;
  if(key[0]==='p') return P[+key.slice(1)] || null;
  const m=key.slice(1).split('.'), f=FLOWS.find(x=>x.id===m[0]);
  const b = f && f.steps[+m[1]] && f.steps[+m[1]].blocks[+m[2]];
  if(!b) return null;
  if(key[0]==='f') return b;
  if(key[0]==='h') return b.items && b.items[+m[3]] || null;
  return null;
}

/* Corps commun d'une phrase : français, allemand, prononciation, actions */
function phraseBody(p, key, q){

    <div class="pc-de" lang="de">${hl(p.de)}</div>

    </div>`;
}
function phraseCard(p, key, q, src){

}

   MOTEUR DE LEÇON
══════════════════════════════════════ */
const PRAISE=['Excellent !','Parfait !','Bravo !','Très bien !','Sehr gut !','Wunderbar !'];
let L=null;
const tokens = s => s.replace(/[.,!?;:…]/g,'').split(/\s+/).filter(Boolean);
const canBuild = p => !p.de.includes('…') && tokens(p.de).length>=3 && tokens(p.de).length<=10;

function distractors(i, field, n){
  const t=P[i], same=P.map((p,j)=>j).filter(j=>j!==i && P[j].c===t.c && P[j].fr!==t.fr && P[j].de!==t.de);
  const other=shuffle(P.map((p,j)=>j).filter(j=>j!==i && isBase(P[j].c)===isBase(t.c) && P[j].c!==t.c && P[j].fr!==t.fr));
  const pool=[...shuffle(same), ...other], out=[], seen=new Set([t[field]]);
  for(const j of pool){ if(out.length>=n) break; if(!seen.has(P[j][field])){ seen.add(P[j][field]); out.push(j); } }
  return out;
}
function buildExercises(idx){
  const base = idx.length && isBase(P[idx[0]].c);
  const a = shuffle(idx).map(i=>({t:'listen', i}));
  let b;
  if(base){
    b = shuffle(idx).slice(0, Math.ceil(idx.length/2)).map(i=>({t:'choose', i}));
    if(idx.length>=3) b.push({t:'match', set:shuffle(idx).slice(0,5)});
  } else {
    b = shuffle(idx).map(i=>({t: canBuild(P[i]) && Math.random()<.7 ? 'build' : 'choose', i}));
  }
  return [...a, ...shuffle(b)];
}
function startLesson(opts){
  stopAudio();
  const q=buildExercises(opts.idx);
  L={...opts, q, pos:0, done:0, total:q.length, wrong:0, answered:0, correct:0, state:'ask', sel:null, retried:new Set(), t0:Date.now()};
  $('#lesson').hidden=false; document.body.style.overflow='hidden';
  renderEx();
}
function closeLesson(){
  stopAudio(); L=null; $('#lesson').hidden=true; document.body.style.overflow=''; render();
}
async function askQuit(){
  const stay = await modal({title:'Quitter la leçon ?', text:'Ta progression dans cette leçon ne sera pas enregistrée.', ok:'Continuer la leçon', cancel:'Quitter'});
  if(!stay) closeLesson();
}
function lessonShell(inner, foot){
  const pct = L.total ? Math.round(L.done/L.total*100) : 0;
  return `<div class="l-top"><button class="icon-btn" data-act="quit" aria-label="Quitter la leçon">${icon('i-x')}</button>
      <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div></div>
    <div class="l-body"><div class="l-inner">${inner}</div></div>
    <div class="l-foot" id="lfoot"><div class="l-foot-in">${foot}</div></div>`;
}
function footHTML(){
  return `<div class="l-fb" id="lfb"></div><button class="btn" id="lbtn" data-act="check" disabled>Vérifier</button>`;
}
function renderEx(){
  const ex=L.q[L.pos], box=$('#lesson');
  L.state='ask'; L.sel=null; L.built=[];
  if(!ex){ return finishLesson(); }
  let inner='';
  if(ex.t==='listen'){
    const p=P[ex.i], opts=shuffle([ex.i, ...distractors(ex.i,'fr',3)]);
    L.opts=opts; L.answer=ex.i;
    inner=`<span class="eyebrow l-kind">Compréhension orale</span><h2 class="l-q">Écoute et choisis la bonne traduction</h2>
      <div class="l-audio"><button class="play lg" data-act="lplay" aria-label="Écouter la phrase">${icon('i-spk')}</button>
        <button class="slow" data-act="lslow" aria-label="Écouter lentement">Écouter lentement</button></div>
      <div class="opts" id="opts">${opts.map((j,k)=>`<button class="opt" data-act="opt" data-k="${k}"><kbd>${k+1}</kbd><span>${esc(P[j].fr)}</span></button>`).join('')}</div>`;
    setTimeout(()=>{ if(L && L.q[L.pos]===ex) play(p.de, $('.play.lg')); }, 350);
  }
  if(ex.t==='choose'){
    const p=P[ex.i], opts=shuffle([ex.i, ...distractors(ex.i,'de',3)]);
    L.opts=opts; L.answer=ex.i;
    inner=`<span class="eyebrow l-kind">Vocabulaire</span><h2 class="l-q">Comment dit-on en allemand ?</h2>
      <div class="l-say">${esc(p.fr)}</div>
      <div class="opts" id="opts">${opts.map((j,k)=>`<button class="opt" data-act="opt" data-k="${k}" lang="de"><kbd>${k+1}</kbd><span>${esc(P[j].de)}</span></button>`).join('')}</div>`;
  }
  if(ex.t==='build'){
    const p=P[ex.i], tk=tokens(p.de);
    const extra=[]; for(const j of distractors(ex.i,'de',6)){ for(const w of tokens(P[j].de)) if(!tk.includes(w) && !extra.includes(w)){ extra.push(w); break; } if(extra.length>=3) break; }
    L.bank=shuffle([...tk, ...extra]); L.answer=ex.i;
    inner=`<span class="eyebrow l-kind">Construction</span><h2 class="l-q">Traduis cette phrase</h2>
      <div class="l-say">${esc(p.fr)}</div>
      <div class="answer-line" id="aline" aria-label="Ta réponse"></div>

  }

    inner=`<span class="eyebrow l-kind">Association</span><h2 class="l-q">Associe les paires</h2>
      <div class="pairs"><div class="col">${shuffle(ex.set).map(i=>`<button class="pair" data-act="pde" data-i="${i}" lang="de">${esc(P[i].de)}</button>`).join('')}</div>
      <div class="col">${shuffle(ex.set).map(i=>`<button class="pair" data-act="pfr" data-i="${i}">${esc(P[i].fr.replace(/^[\d ]+\s—\s/,''))}</button>`).join('')}</div></div>`;
  }

}
function selectOpt(k){
  if(L.state!=='ask') return;
  L.sel=k;
  document.querySelectorAll('#opts .opt').forEach((b,j)=>b.classList.toggle('sel', j===k));
  if(L.q[L.pos].t==='choose') play(P[L.opts[k]].de, null);
  $('#lbtn').disabled=false;
}
function renderBuilt(){
  $('#aline').innerHTML=L.built.map((k,pos)=>`<button class="tile" data-act="untile" data-pos="${pos}" lang="de">${esc(L.bank[k])}</button>`).join('');
  document.querySelectorAll('#bank .tile').forEach(b=>b.classList.toggle('used', L.built.includes(+b.dataset.k)));
  $('#lbtn').disabled = !L.built.length;
}
function check(){
  const ex=L.q[L.pos]; let ok;
  if(ex.t==='listen'||ex.t==='choose') ok = L.opts[L.sel]===L.answer;
  if(ex.t==='build') ok = L.built.map(k=>L.bank[k]).join(' ').toLowerCase() === tokens(P[L.answer].de).join(' ').toLowerCase();
  L.answered++;
  const p=P[L.answer], key='p'+L.answer;
  if(ok){
    L.correct++; S.mistakes=S.mistakes.filter(k=>k!==key);
  } else {
    L.wrong++; if(!S.mistakes.includes(key)) S.mistakes=[key, ...S.mistakes].slice(0,40);
    if(!L.retried.has(L.pos)){ L.retried.add(L.q.length); L.q.push({...ex}); L.total++; }
  }
  save();
  if(ex.t==='listen'||ex.t==='choose'){
    $('#opts').classList.add('locked');
    document.querySelectorAll('#opts .opt').forEach((b,j)=>{ if(L.opts[j]===L.answer) b.classList.add('ok'); else if(j===L.sel) b.classList.add('ko'); b.classList.remove('sel'); });
  }
  if(ex.t==='build'){ document.querySelectorAll('#aline .tile, #bank .tile').forEach(b=>b.disabled=true); }
  if(ok || ex.t!=='listen') play(p.de, null);
  feedback(ok, p);
}
function feedback(ok, p){
  L.state='fb'; if(ok) L.done++;
  sfx(ok?'ok':'ko');
  const ex=L.q[L.pos];
  const sol = p ? (ex.t==='listen' ? p.fr : p.de) : '';
  $('#lfb').innerHTML = tfr(ok
    ? `<span class="fb-ic">${icon('i-check')}</span><div><b>${pick(PRAISE)}</b>${p?`<div class="fb-sub"><span lang="de">${esc(p.de)}</span>${S.phon&&p.ph?' · <i>'+esc(p.ph)+'</i>':''}</div>`:''}</div>`
    : `<span class="fb-ic">${icon('i-x')}</span><div><b>Réponse correcte :</b><div class="fb-sol">${esc(sol)}</div>${ex.t==='listen'?`<div class="fb-sub" lang="de">${esc(p.de)}</div>`:`<div class="fb-sub">${esc(p.fr)}</div>`}</div>`);
  $('#lfoot').classList.add(ok?'good':'bad');
  const b=$('#lbtn'); b.disabled=false; b.dataset.act='next'; b.textContent='Continuer';
  b.className='btn '+(ok?'ok':'ko'); b.focus();
  const bar=$('.l-top .bar i'); if(bar) bar.style.width=Math.round(L.done/L.total*100)+'%';
}
function matchTap(kind, btn){
  const i=+btn.dataset.i;
  if(kind==='de'){ L.selDe=btn; play(P[i].de,null); } else L.selFr=btn;
  document.querySelectorAll(`.pair[data-act="p${kind}"]`).forEach(b=>b.classList.toggle('sel', b===btn));
  if(L.selDe && L.selFr){
    const a=L.selDe, b=L.selFr;
    if(a.dataset.i===b.dataset.i){
      [a,b].forEach(x=>{ x.classList.remove('sel'); x.classList.add('ok'); x.disabled=true; });
      L.matched++; sfx('ok');
      if(L.matched===L.set.length){ L.answered++; L.correct++; setTimeout(()=>feedback(true,null),250); }
    } else {
      L.wrong++; sfx('ko');
      [a,b].forEach(x=>{ x.classList.remove('sel'); x.classList.add('ko'); setTimeout(()=>x.classList.remove('ko'),450); });
    }
    L.selDe=L.selFr=null;
  }
}
function finishLesson(){
  const perfect = L.wrong===0, xp = 10 + (perfect?5:0);
  const acc = L.answered ? Math.round(L.correct/L.answered*100) : 100;
  const hadGoal = dayXp()>=S.goal;
  if(L.u!==undefined) S.lessons[lessonKey(L.u,L.l)]=(S.lessons[lessonKey(L.u,L.l)]||0)+1;
  addXP(xp);
  const goalNow = !hadGoal && dayXp()>=S.goal;
  const secs=Math.round((Date.now()-L.t0)/1000), time=Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');
  sfx('win'); confetti();
  $('#lesson').innerHTML=tfr(`<div class="l-body"><div class="l-inner"><div class="l-end">
      <div class="seal">${icon('i-check')}</div>
      <h2>${perfect?'Sans faute 🏆':'Leçon terminée 🎉'}</h2>
      <p>${goalNow?'Objectif du jour atteint. Bravo !':perfect?'Ausgezeichnet ! Aucune erreur sur toute la leçon.':'Chaque leçon te rapproche d\'un accueil fluide en allemand.'}</p>
      <div class="res">
        <div><b>+${xp}</b><small>XP gagnés</small></div>
        <div><b>${acc} %</b><small>Précision</small></div>
        <div><b>${time}</b><small>Durée</small></div>
        <div><b>${streakNow()}</b><small>${streakNow()>1?'Jours de série':'Jour de série'}</small></div>
      </div></div></div></div>
    <div class="l-foot"><div class="l-foot-in"><button class="btn block" style="margin:0" data-act="endok">Continuer</button></div></div>`);
  $('[data-act="endok"]').focus();
}
function seenPhrases(){
  const seen=[]; ORDER.forEach(u=>unitLessons(u).forEach((idx,l)=>{ if(lessonDone(u,l)) seen.push(...idx); }));
  return seen.length>=5 ? seen : unitPhrases(0).concat(seen);
}

document.addEventListener('click', async e=>{
  const nav=e.target.closest('[data-nav]'); if(nav){ go('#/'+nav.dataset.nav); return; }
  const to=e.target.closest('[data-nav-to]'); if(to && !to.disabled){ go(to.dataset.navTo); return; }
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, d=el.dataset;
  switch(a){
    case 'play': case 'slow': { const p=byKey(d.key); if(p) play(p.de, el, a==='slow'); break; }
    case 'fav': {
      favs.has(d.key) ? favs.delete(d.key) : favs.add(d.key); save();
      toast(favs.has(d.key)?'⭐ Ajoutée aux favoris':'Retirée des favoris');
      const y=window.scrollY; render(); window.scrollTo(0,y); break;
    }
    case 'start': { const u=+d.u, l=+d.l; startLesson({u, l, idx:unitLessons(u)[l]}); break; }
    case 'continue': { const n=nextLesson(); if(n) startLesson({u:n.u, l:n.l, idx:unitLessons(n.u)[n.l]}); break; }
    case 'practice': startLesson({idx:shuffle(seenPhrases()).slice(0,5)}); break;
    case 'mistakes': { const idx=S.mistakes.filter(k=>k[0]==='p'&&byKey(k)).map(k=>+k.slice(1)).slice(0,6); if(idx.length) startLesson({idx}); break; }
    case 'flowdone': S.flowsDone[d.id]=1; save(); sfx('win'); toast('Situation terminée. Bravo ! 🎉'); go('#/situ'); break;
    case 'seg': phraseSeg=d.seg; render(); break;
    case 'rules': phraseSeg='rules'; searchQ=''; go('#/phrases'); break;
    case 'clearq': searchQ=''; render(); $('#q').focus(); break;
    case 'catback': history.length>1 ? history.back() : go('#/phrases'); break;
    case 'goal': S.goal=+d.g; save(); render(); toast('Objectif : '+d.g+' XP par jour'); break;
    case 'toggle': S[d.k]=!S[d.k]; save(); applySettings(); render(); break;
    case 'test': {
      const n=window.AUDIO?Object.keys(window.AUDIO).length:0;
      play(P[0].de, null);
      toast(n ? 'Voix allemande native : '+n+' phrases disponibles' : 'Voix du navigateur (fichiers audio non chargés)');
      break;
    }
    case 'reset': {
      const ok=await modal({title:'Réinitialiser ta progression ?', text:'Tes XP, ta série et tes leçons terminées seront effacés. Tes favoris sont conservés.', ok:'Tout réinitialiser', okCls:'ko', cancel:'Annuler'});
      if(ok){ S={...DEF, name:S.name, goal:S.goal, phon:S.phon, sfx:S.sfx}; save(); render(); toast('Progression réinitialisée'); }
      break;
    }
    // Leçon
    case 'quit': askQuit(); break;
    case 'lplay': case 'lslow': play(P[L.answer].de, el, a==='lslow'); break;
    case 'opt': selectOpt(+d.k); break;
    case 'tile': if(L.state==='ask'){ L.built.push(+d.k); renderBuilt(); } break;
    case 'untile': if(L.state==='ask'){ L.built.splice(+d.pos,1); renderBuilt(); } break;
    case 'pde': matchTap('de', el); break;
    case 'pfr': matchTap('fr', el); break;
    case 'check': if(L && L.state==='ask') check(); break;
    case 'next': if(L){ stopAudio(); L.pos++; renderEx(); } break;
    case 'endok': closeLesson(); break;
  }
});
document.addEventListener('input', e=>{
  if(e.target.id==='q'){ searchQ=e.target.value; const pos=e.target.selectionStart; render(); const i=$('#q'); i.focus(); i.setSelectionRange(pos,pos); }
  if(e.target.id==='name'){ S.name=e.target.value; save(); const m=$('.mono'); if(m) m.innerHTML=S.name.trim()?esc(S.name.trim()[0].toUpperCase()):icon('i-user'); }

    <button class="btn sm" data-act="install">Installer</button></div>`);
  if(CFG.onesignalAppId) rows.push(`<div class="setting"><div class="s-tx"><b>🔔 Rappel de la leçon du jour</b><small>${notifOn()?'Activé : une notification chaque jour':'Une notification pour ne pas oublier ta leçon'}</small></div>
    ${notifOn()?'<span class="pill-ok">Activé</span>':'<button class="btn sm" data-act="notif">Activer</button>'}</div>`);
  rows.push(`<div class="setting"><div class="s-tx"><b>🤝 Partager avec un collègue</b><small>Un QR code à scanner, ou une affiche à imprimer</small></div>
    <button class="btn sec sm" data-act="share">QR code</button></div>`);
  return `<div class="sec-t"><h2>Application</h2></div><div class="card" style="padding:0 20px">${rows.join('')}</div>`;
}
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  switch(el.dataset.act){
    case 'install': doInstall(); break;
    case 'later': try{ localStorage.setItem('bgd_install_later', Date.now()+7*864e5); }catch(err){} render(); break;
    case 'share': doShare(); break;
    case 'poster': printPoster(); break;
    case 'notif': enableNotif(); break;
  }
});

/* ══ INIT ══ */
applySettings();
render();
</script>
</body>
</html>
